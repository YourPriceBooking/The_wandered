name: Check Branch Up-to-Date

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  seo-indexing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:seo-indexing
      - run: npm run test:server-articles
      - run: npm run test:social-metadata
      - run: npm run test:pagination-archive
      - run: npm run test:schema-semantics
      - run: npm run test:header
      - run: node --test tests/route-loader.test.cjs
      - run: npm run test:performance-cache
      - run: npm run lint:seo-release
      - run: npm run test:seo-release
      - run: npm run build
      - run: npx tsc --noEmit --incremental false
      - name: Production HTTP contracts
        env:
          KEEP_ARTICLE_HTTP_LOGS: '1'
        run: |
          set -o pipefail
          npm run test:server-articles:http 2>&1 | tee seo-http-tests.log
      - name: Retain HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-http-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            seo-http-tests.log
            .next/article-http-*/server.log
            .next/article-http-*/last-response.html

  check-behind-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # fetch all history to compare branches

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check if branch is behind main
        run: |
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" -gt 0 ]; then
            echo "❌ Your branch is behind 'main' by $BEHIND commits. Please rebase or merge main first."
            exit 1
          else
            echo "✅ Your branch is up to date with main."
          fi
